name: Despliegue de la API a Render

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'render.yaml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      # El build de Render es el que manda, pero compilar aqui evita que un
      # error llegue a Render y deje el servicio caido o con un deploy fallido.
      # No se lanzan los tests: dependen de MongoDB Atlas y cuando Atlas va
      # lento el contexto tarda 30 minutos en cargar y tumban 9 tests en cascada.
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compilar el jar
        run: ./mvnw -B clean package -DskipTests

      - name: Comprobar que las clases son de Java 26
        run: |
          unzip -p target/api-0.0.1-SNAPSHOT.jar BOOT-INF/classes/org/palomafp/apijuegos/api/ApiApplication.class \
            | od -An -tu1 -N8 | awk '{ print "major version:", $7*256+$8 }'

  deploy:
    name: Deploy a Render
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Render genera un "deploy hook" por servicio en
      # Settings > Deploy > Deploy Hook. Ese es el único secreto que hace
      # falta aqui: las credenciales de Mongo viven en el panel de Render.
      - name: Disparar el deploy hook de Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Falta el secreto RENDER_DEPLOY_HOOK_URL en el repositorio."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
          echo "Render ha recibido el deploy. El estado se ve en el panel de Render."
