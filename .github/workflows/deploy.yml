name: Deploy Spring Boot API to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: target/api-0.0.1-SNAPSHOT.jar
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-jar
          path: .

      - name: Copy JAR file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "api-0.0.1-SNAPSHOT.jar"
          target: "~/app"

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Crear directorio de la aplicación si no existe
            mkdir -p ~/app
            cd ~/app
            
            # Generar o sobreescribir el archivo .env utilizando los secretos de GitHub
            echo "MONGO_USER=${{ secrets.MONGO_USER }}" > .env
            echo "MONGO_PASS=${{ secrets.MONGO_PASS }}" >> .env
            echo "MONGO_DB=${{ secrets.MONGO_DB }}" >> .env
            echo "CLAVE_CIFRADO=${{ secrets.CLAVE_CIFRADO }}" >> .env
            
            # Buscar si la API ya se está ejecutando y detenerla de forma segura
            PID=$(pgrep -f 'api-0.0.1-SNAPSHOT.jar' || echo "")
            if [ ! -z "$PID" ]; then
              echo "Deteniendo proceso existente de la API (PID: $PID)..."
              kill -15 $PID
              sleep 5
              kill -9 $PID 2>/dev/null || true
            fi
            
            # Liberar el puerto 8080 si estuviera retenido por algún motivo
            sudo fuser -k 8080/tcp 2>/dev/null || true
            
            # Levantar la API en segundo plano con la configuración del .env
            echo "Iniciando nueva versión de la API REST..."
            nohup java -jar api-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
            
            # Esperar unos segundos para verificar que se inició correctamente
            sleep 5
            if pgrep -f 'api-0.0.1-SNAPSHOT.jar' > /dev/null; then
              echo "¡API levantada exitosamente en EC2!"
            else
              echo "ADVERTENCIA: La API no se detecta en ejecución. Revisa ~/app/app.log para ver los detalles del error."
              exit 1
            fi
