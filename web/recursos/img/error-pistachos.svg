<svg width="640" height="480" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="La API se ha caido">
  <title>La API se ha caido</title>
  <defs>
    <linearGradient id="pkShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#4E7B1F"/>
    </linearGradient>
    <linearGradient id="pkKernel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3E39B"/>
      <stop offset="100%" stop-color="#C9AE52"/>
    </linearGradient>
    <filter id="pkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="480" rx="28" fill="#0B0E14"/>
  <rect x="10" y="10" width="620" height="460" rx="22" fill="none" stroke="#FF3B30" stroke-width="3" opacity="0.75" filter="url(#pkGlow)"/>

  <!-- Pistacho monumentalm, la broma de la casa -->
  <g transform="translate(320 210)">
    <g filter="url(#pkGlow)">
      <path d="M0 -120c54 0 96 46 96 108 0 58-40 100-96 100s-96-42-96-100C-96 -74 -54 -120 0 -120z" fill="url(#pkShell)"/>
      <path d="M0 -104c-46 0-82 40-82 94 0 22 8 40 20 54-6-12-9-26-9-42 0-52 36-94 82-94 22 0 42 8 57 21-19-21-43-33-68-33z" fill="#A8D96A" opacity="0.65"/>
      <path d="M0 -60c34 0 60 26 60 62 0 34-26 56-60 56s-60-22-60-56c0-36 26-62 60-62z" fill="url(#pkKernel)"/>
      <!-- La "X" de GameBoXD, calada en el kernel -->
      <g stroke="#4E7B1F" stroke-width="11" stroke-linecap="round">
        <path d="M-26 -26 L26 26"/>
        <path d="M26 -26 L-26 26"/>
      </g>
    </g>
  </g>

  <text x="320" y="386" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="800" fill="#F8FAFC">La API se ha caido</text>
  <text x="320" y="420" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="17" font-weight="600" fill="#FF3B30">enciende la api tontito</text>
</svg>
