      <path d="M6 12h4M8 10v4"/>
      <path d="M15.5 11.5h.01M18.5 13.5h.01" stroke-width="2.6"/>
      <path d="M17.5 17.5l1 3.2a1.7 1.7 0 0 1-2.9 1.2L13.5 19h-3L10 21.9a1.7 1.7 0 0 1-2.9-1.2l1-3.2A6 6 0 0 1 7 12a7 7 0 0 1 14 0 6 6 0 0 1-3.5 5.5z"/>
    </g>
  </g>

  <!-- Logotipo -->
  <text x="62" y="30" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="25" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Game<tspan fill="#00DBFF">Bo</tspan><tspan fill="#F8FAFC">XD</tspan></text>
  <text x="63" y="45" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
