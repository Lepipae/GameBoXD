<svg width="200" height="56" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" role="img" aria-label="GameBoXD">
  <title>GameBoXD</title>
  <defs>
    <linearGradient id="gbxdStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00DBFF"/>
      <stop offset="100%" stop-color="#00A6C4"/>
    </linearGradient>
    <linearGradient id="gbxdFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
  </defs>

  <!-- Marca: caja redondeada con un mando dentro -->
