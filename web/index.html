<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBoXD</title>
    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="recursos/style.css">
  </head>
  <body>
  <!-- Cabecera de la pagina -->
    <header class="main-header">
      <div class="header-left">
        <button class="icon-button" type="button" aria-label="Usuario">
          <img src="https://gameboxd.s3.us-east-1.amazonaws.com/web/user.png" alt="Usuario">
        </button>
        <button class="nav-button" type="button">Mi perfil</button>
        <button class="nav-button" type="button">Mi lista</button>
      </div>
      
      <div class="header-center">
        <h1>GameBoXD</h1>
      </div>
      
      <div class="header-right">
        <img src="https://gameboxd.s3.us-east-1.amazonaws.com/web/logoGameboxd.png" alt="GameBoXD Logo" class="logo">
      </div>
    </header>
    <!-- Seccion principal -->

    <main>
      <div class="search-container">
        <div class="search-bar">
          <button class="search-icon-wrapper" type="button">
            <img src="https://gameboxd.s3.us-east-1.amazonaws.com/web/search.png" alt="Buscar">
          </button>
          <input type="text" class="search-input" placeholder="Encuentra tus juegos favoritos">
        </div>
      </div>

      <!-- Hero Section -->
      <section class="hero-section">
        <div class="hero-left">
          <h2>Lo más jugado<br>esta semana</h2>
        </div>
        <div class="hero-middle">
          <img src="https://gameboxd.s3.us-east-1.amazonaws.com/web/flecha.png" alt="Siguiente" class="hero-arrows">
        </div>
        <div class="hero-right">
          <img src="https://gameboxd.s3.us-east-1.amazonaws.com/web/helldivers.jpg" alt="Helldivers 2" class="hero-image">
        </div>
      </section>

      <!-- Sección de recomendaciones -->
      <section class="recommendations-section">
        <h1 class="section-title">Recomendaciones</h1>
        <div class="contenedor-recomendaciones">
          <div class="recomendacion" id="r1">
            
          </div>
          <div class="recomendacion" id="r2">
            
          </div>
          <div class="recomendacion" id="r3">
            
          </div>
          <div class="recomendacion" id="r4">
            
          </div>
        </div>
      </section>
    </main>


    <!-- Pie de pagina -->
    <footer class="main-footer">
      <p>Proyecto realizado para el IES Virgen de la Paloma</p>
      <div class="footer-social">
        <button class="social" type="button">
          <a href="https://www.palomafp.org/" target="_blank" rel="noopener noreferrer">
            <img src="https://gameboxd.s3.us-east-1.amazonaws.com/web/iconoEscuela.png" alt="IES Virgen de la Paloma">
          </a>
        </button>
        <button class="social" type="button">
          <a href="https://github.com/Lepipae/GameBoXD" target="_blank" rel="noopener noreferrer">
            <img src="https://gameboxd.s3.us-east-1.amazonaws.com/web/github.png" alt="GitHub">
          </a>
        </button>
      </div>
    </footer>

    <script src="recursos/indexScript.js"></script>
  </body>
</html>
