spring.config.import=optional:file:.env[.properties]
spring.application.name=api
spring.data.mongodb.uri=mongodb+srv://${MONGO_USER}:${MONGO_PASS}@bd-apijuegos.v0ynuuf.mongodb.net/${MONGO_DB}?retryWrites=true&w=majority&appName=bd-apiJuegos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Rendimiento de la API ------------------------------------------------
# Comprime las respuestas si el proxy de delante no lo hace ya (Cloudflare
# comprime en producción, pero en local y en otros despliegues no hay nadie).
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/plain,application/javascript,image/svg+xml
server.compression.min-response-size=512

# Un hilo virtual por petición: esperar a MongoDB (I/O bloqueante) deja de
# consumir un hilo de plataforma del pool de Tomcat.
spring.threads.virtual.enabled=true

# Nota: NO se omite `null` en el JSON. La API publica `"urlImagen": null` como
# parte del contrato (lo comprueba UrlImagenTest y lo consume el frontend), y
# el ahorro real de bytes viene de las proyecciones de MongoDB y de los DTOs,
# no de esconder campos nulos.
